# Fontes de notícia do TSA Tech (nicho tributário). O jornal só publica notícias
# sobre tributos (edition.focus_only em config/site.yaml): as dos feeds gerais
# passam por um filtro de palavras-chave; as dos feeds especializados
# (niche: true) entram todas. Para testar os endereços:
#   python -m qijournal check-sources
#
# Campos:
#   id        identificador curto da fonte (repete-se entre feeds do mesmo veículo)
#   name      nome exibido nos créditos
#   url       endereço do feed
#   lang      pt | en | es
#   weight    peso editorial (0.5 a 1.5) usado no ranqueamento heurístico
#   topics    dicas de seção (ids de config/site.yaml) para o classificador;
#             [] deixa as palavras-chave decidirem
#   niche     true: feed só sobre tributos, todas as notícias dele entram
#   enabled   false para desligar sem apagar
#   exclude_url_patterns  trechos de URL descartados só nesta fonte
#
# As fontes gerais de esporte, cultura, natureza, tecnologia, imobiliário e
# mundo do jornal geral (PBCV Tech) saíram: não trazem notícia tributária.

feeds:
  # ── Especializados em tributos (niche: true) ─────────────────────────────
  # Acrescentados em 09/10/2026 SEM TESTE a partir do Actions: os endereços
  # seguem o padrão de cada site (pasta de notícias do gov.br, tags do
  # WordPress, que já funcionam para outras tags desses sites). Os que falharem
  # aparecem em "Feeds com erro" no Summary da execução: troque por enabled: false.
  - {id: receitafederal, name: "Receita Federal", url: "https://www.gov.br/receitafederal/pt-br/assuntos/noticias/RSS", lang: pt, weight: 1.3, topics: [federais], niche: true}
