edition:
  max_age_hours: 30            # ignora notícias mais velhas que isso
  max_candidates: 180          # candidatos enviados ao editor (após deduplicação)
  target_stories: 20           # matérias na edição (o editor pode variar ±4)
  secondary_count: 3           # chamadas ao lado da manchete
  highlights_count: 8          # lista numerada "Destaques"
  # Nicho: só ficam as notícias das seções (palavras-chave no título, ou repetidas
  # no resumo) e as de feeds niche: true. O resto (mercado, esporte…) fica de fora.
  focus_only: true
  # Mínimos da coleta: abaixo deles a edição é abortada (job vermelho) e a
  # anterior continua no ar. min_articles e min_pt_sources_ok contam só as
  # notícias que passaram pelo foco (num dia normal, de 300 a 700).
  min_articles: 15
  min_sources_ok: 12
  min_sources_ratio: 0.5       # fração mínima de feeds ok
  min_pt_sources_ok: 4         # veículos em português com notícias do foco
  enrich_limit: 40             # quantas matérias têm a página original consultada (imagem/descrição)
  # Descartados em todas as fontes (trecho da URL): só o que não é notícia
  # (publieditorial, loteria, horóscopo, vídeo sem texto). Esporte,
  # entretenimento e cultura entram (seções Esporte e Cultura & Variedades).
  exclude_url_patterns:
    - "/horoscopo/"
    - "/loterias/"
    - "resultado-do-concurso"
    - "/patrocinado/"          # publieditorial
    - "/native/"
    - "/presented/"
    - "/buyside/"
    - "bbc.com/news/videos/"   # vídeos sem texto (os de análise da NeoFeed/g1 ficam)
    - "bbc.co.uk/news/videos/"
    - "aljazeera.com/video/"
  # Títulos de serviço (regex no título sem acento e em minúsculas). "ao vivo"
  # solto não entra: derrubaria coberturas como "Ibovespa ao vivo".
  exclude_title_patterns:
    - 'veja (?:o )?numero e nome'
    - 'quem sao os candidatos'
    - 'resultado d[oa] (?:concurso|mega ?sena|lotofacil|quina|lotomania|timemania|dupla ?sena)'
    - 'confira o resultado'
    - 'horoscopo'
    - '(?:como|onde) assistir'
    - 'gabarito'
    - 'transmite ao vivo'
    # Fundos imobiliários e cotações (mercado, não o Imobiliário do escritório)
    - 'fundos? imobiliarios?'
    - '\bfiis?\b'
    - '\bifix\b'
    - '\b[a-z]{4}1[1-3]\b'

llm:
  enabled: true
  # Linha editorial (acrescentada às instruções de todas as IAs).
  editorial_brief: |
    Este é o TSA Tech, boletim diário do TSA Advogados. O leitor é advogado, executivo ou gestor de empresa que precisa saber, cedo, o que mudou nas áreas em que o escritório atua.
    - Prioridade 1, as áreas do escritório, nesta ordem de peso: Tributário (o carro-chefe: reforma tributária e sua regulamentação, IR, ICMS, ISS, PIS/Cofins, contribuições, julgamentos tributários do STF, STJ e CARF, atos da Receita, PGFN, Fazenda e fiscos), Previdenciário (custeio, benefícios, previdência complementar), Trabalhista (TST, CLT, jornada, terceirização, negociação coletiva), Recuperação de Empresas (recuperação judicial, falências, reestruturação de dívidas), Cível (responsabilidade civil, contratos, societário, consumo, seguros, propriedade intelectual, arbitragem) e Imobiliário (incorporação, locação, registro, leilões, crédito imobiliário).
    - Prioridade 2, só depois: Política (no máximo 4 matérias) e Geopolítica (no máximo 3). A manchete é sempre de uma área do escritório.
    - Notícia fora dessas seções (mercado financeiro, esporte, cultura, tecnologia) não vira matéria.
    - Em cada matéria das áreas do escritório, diga com precisão o que muda, para quem, a partir de quando e com base em quê (lei, decreto, instrução normativa, tema de repercussão geral ou recurso repetitivo, número do processo), sempre que os textos trouxerem esses dados. Nunca invente números de lei, de tema, alíquotas ou prazos.
    - why_it_matters: o efeito prático para empresas e pessoas (custo, prazo, risco, oportunidade).
  # ── Modo "blocos": compilação por editoria. TODAS as notícias do dia são
  # divididas pelos blocos abaixo (seções afins lidas numa mesma chamada; seção
  # fora da lista vai para um bloco "Demais editorias"). Em cada bloco, a IA une
  # as notícias sobre o mesmo assunto, interpreta o foco de cada veículo e em
  # que lado do debate ele ficou (cobertura comparada) e redige as principais
  # matérias. Depois, uma chamada de fechamento escolhe as matérias da edição e
  # a manchete, escreve o editorial e o "Em 1 minuto" e junta assuntos
  # repetidos entre blocos. Um bloco que não cabe no limite da chamada (entrada
  # ou saída do modelo) é dividido em partes iguais, até max_calls chamadas no
  # total. Sem block_groups: `blocks` partes de tamanho igual.
  block_groups:
    - {name: "Tributário", sections: [tributario]}
    - {name: "Previdenciário & Trabalhista", sections: [previdenciario, trabalhista]}
    - {name: "Recuperação, Cível & Imobiliário", sections: [recuperacao, civel, imobiliario]}
    - {name: "Política & Geopolítica", sections: [politica, mundo]}
  blocks: 4
  max_calls: 9
  block_closing: true
  # Provedores com API no formato OpenAI. Valores omitidos vêm do padrão em
  # qijournal/config.py (DEFAULT_APIS); o modelo também pode ser trocado pela
  # variável QIJ_<NOME>_MODEL (ex.: QIJ_AIML_MODEL) no GitHub.
  apis:
    gemini:      # grátis (Google AI Studio, modelos Flash); chave: GEMINI_API_KEY
      model: "gemini-flash-latest"   # apelido do Flash mais novo; trocável por QIJ_GEMINI_MODEL
      mode: blocos
    gemini_lite: # mesma chave; Flash-Lite quando o Flash está sobrecarregado (503)
      model: "gemini-flash-lite-latest"   # trocável por QIJ_GEMINI_LITE_MODEL
      mode: blocos
    aiml:        # pago por saldo (a conta grátis recusou o gpt-5-5: "run out of funds")
      model: "openai/gpt-5-5"
      mode: blocos
      max_requests: 10         # teto por edição, contando novas tentativas
      parallel: 3
    sensenova:   # grátis (beta): 1.500 requisições a cada 5 horas por modelo
      model: "sensenova-6.8-flash-lite"
      mode: blocos
      parallel: 2
    mistral:     # grátis (Experiment): poucas requisições por minuto
      # A chave gratuita recusou o mistral-large-latest ("not available in your
      # subscription tier"); o small cabe na janela de 128k e é o do plano grátis.
      # Para trocar sem mexer no código: variável QIJ_MISTRAL_MODEL no GitHub.
      model: "mistral-small-latest"
      mode: blocos
      min_interval_seconds: 30
    kimi:        # pago: exige recarga mínima de US$ 1
      model: "kimi-k3"
      mode: blocos
  # ── Modo "etapas" (alternativa): agrupamento em lotes, pauta, redação em
  # lotes e cobertura em lotes, em chamadas separadas (10-15 por edição).
  topics_batch_chars: 100000   # tamanho de cada lote do agrupamento por assunto
  write_batch_size: 12         # matérias redigidas por chamada
  # Cobertura comparada (os dois modos)
  coverage: true               # lados do debate e conclusão
  coverage_min_outlets: 2      # veículos distintos para comparar um assunto
  coverage_max_topics: 80      # assuntos além das matérias da edição
  coverage_batch_chars: 45000
  # ── Claude (reserva): pauta + redação em duas chamadas.
  model: "claude-opus-5-5"
  effort: "medium"
  # O raciocínio do modelo conta dentro de max_tokens (saída máxima: 128k); com
  # folga, a resposta não é cortada, o que descartaria a edição por IA inteira.
  max_tokens_select: 64000
  max_tokens_write: 64000
  # Prazo total da edição por IA, comum a todos os editores tentados (s). Com a
  # coleta (~8 min no pior caso), cabe no timeout-minutes (55) do daily.yml.
  deadline_seconds: 2100
  # Claude: tempo máximo sem dados do stream (a API envia "ping" enquanto o
  # modelo trabalha); nos outros, apis.<nome>.timeout_seconds. Novas
  # tentativas só começam se couberem em deadline_seconds.
  timeout_seconds: 300

# Cotações e indicadores do ticker, na ordem de exibição.
# provider: yahoo (símbolo do Yahoo Finance), coingecko (id da moeda),
#           bcb_sgs (série do SGS/Banco Central).
# transform (bcb_sgs): last = último valor; accum12 = acumulado de 12 meses a partir de variação mensal.
# format: brl | usd | pts | pct
market:
  - {id: usd, label: "Dólar", kind: fx, provider: yahoo, symbol: "USDBRL=X", format: brl, decimals: 2, fallback: {provider: bcb_sgs, series: 1, format: brl, decimals: 2}}
  - {id: eur, label: "Euro", kind: fx, provider: yahoo, symbol: "EURBRL=X", format: brl, decimals: 2, fallback: {provider: bcb_sgs, series: 21619, format: brl, decimals: 2}}
  - {id: cny, label: "Yuan", kind: fx, provider: yahoo, symbol: "CNYBRL=X", format: brl, decimals: 2}
  - {id: ibov, label: "Ibovespa", kind: index, provider: yahoo, symbol: "^BVSP", format: pts, decimals: 0}
  - {id: ifix, label: "IFIX", kind: index, provider: yahoo, symbol: "IFIX.SA", format: pts, decimals: 0}
  - {id: spx, label: "S&P 500", kind: index, provider: yahoo, symbol: "^GSPC", format: pts, decimals: 0}
  - {id: brent, label: "Brent", kind: commodity, provider: yahoo, symbol: "BZ=F", format: usd, decimals: 2}
  - {id: gold, label: "Ouro", kind: commodity, provider: yahoo, symbol: "GC=F", format: usd, decimals: 0}
  - {id: btc, label: "Bitcoin", kind: crypto, provider: yahoo, symbol: "BTC-USD", format: usd, decimals: 0, fallback: {provider: coingecko, coin: bitcoin, format: usd, decimals: 0}}
