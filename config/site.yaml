# Configuração geral do jornal (marca ativa: TSA Tech: áreas do TSA Advogados, política e geopolítica).
# Fontes de notícia ficam em config/sources.yaml.
#
# Várias chaves podem ser sobrescritas por variáveis de ambiente
# (útil no GitHub Actions): QIJ_BRAND, QIJ_BASE_URL, QIJ_MODEL, QIJ_EFFORT,
# QIJ_NO_LLM=1, EMAIL_TO (lista separada por vírgulas).

site:
  base_url: "https://pbcvphyton.github.io/pbcvphyton-tsa-tech/"
  repo_url: "https://github.com/pbcvphyton/pbcvphyton-tsa-tech"
  timezone: "America/Sao_Paulo"
  archive_keep_days: 400        # edições (HTML + JSON) mais antigas são removidas

# Marca ativa: "tech" (TSA Tech) ou "tsa" (TSA Advogados). Um QIJ_BRAND com
# marca que não existe aqui cai nesta marca padrão.
brand: tech

brands:
  tech:
    name: "TSA Tech"
    wordmark: ["", "TSA", " Tech"]   # só sem logo (texto do cabeçalho e alternativa do e-mail)
    # Jornal de nicho: as áreas de atuação do TSA Advogados (tributário à frente)
    # e, em segundo plano, política e geopolítica.
    tagline: "Seu boletim jurídico diário"
    # Logo do TSA (letreiro manuscrito + espiral) com a legenda "TECH" no lugar de
    # "ADVOGADOS" (maior que a do site, para continuar legível no celular): letras brancas sobre ardósia, espiral em
    # azul-céu. O SVG usa currentColor no letreiro (a cor vem de on_masthead).
    logo_svg: "assets/tsa-tech-logo.svg"
    logo_height: 96
    logo_height_mobile: 84
    favicon_svg: "assets/tsa-tech-favicon.svg"
    # Logo do e-mail (PNG 3x, branco sobre a cor do cabeçalho), servido pelo GitHub
    # Pages em base_url + src. O cabeçalho é escuro nos dois modos: sem versão escura.
    email_logo: {src: "assets/tsa-tech-logo-email.png", width: 160, height: 87}
    # Paleta do site do TSA: ardósia do cabeçalho (#32393F), azul-céu dos títulos
    # (#5893D4 / #91C3F5), cinza-azulado de fundo (#EDF2F5) e o cobre da madeira das
    # fotos. O azul dos títulos é claro demais para texto no branco: links e réguas
    # usam um tom mais escuro (#2F6DB5); o azul-céu fica como destaque.
    colors:
      masthead: "#2F363C"    # bloco do cabeçalho (como o topo escuro do site)
      on_masthead: "#FFFFFF" # letreiro, slogan e data sobre o bloco
      primary: "#2F6DB5"     # --qi · azul (links, réguas, chapéus)
      navy: "#232A30"        # --qn · ardósia escura (ticker, rodapé, títulos)
      accent: "#5893D4"      # --qc · azul-céu do site (marcadores, barra de leitura)
      alert: "#A8622B"       # --qr · cobre (radar ao vivo, fonte com erro)
      ticker_up: "#91C3F5"
      ticker_down: "#FF9C8A"
    section_palette: ["#232A30", "#2F6DB5", "#3E5C76", "#A8622B", "#0F7C8C", "#7A5C1F", "#6B3FA0", "#B45309", "#2F7D32", "#5F5E5E"]
  tsa:
    name: "TSA Advogados"
    wordmark: ["TSA", "", " ADVOGADOS"]
    tagline: "Boletim diário · Mercados, Negócios e Direito"
    logo_svg: "assets/tsa-logo.svg"
    favicon_svg: "assets/tsa-favicon.svg"
    colors:
      primary: "#2F6DB5"
      navy: "#232A30"
      accent: "#91C3F5"
      alert: "#A8622B"
      ticker_up: "#91C3F5"
      ticker_down: "#FF9C8A"
    section_palette: ["#232A30", "#1F6F6B", "#2F6DB5", "#5B7FA8", "#A8622B", "#7A5C1F", "#6B3FA0", "#9A5B13", "#2F7D32", "#5F5E5E"]

# Seções da edição, na ordem de exibição: as áreas de atuação do TSA Advogados
# (na ordem do site: tsalaw.com.br/sobre/#js-areas) e, depois, Política e
# Geopolítica, com teto de matérias (max_stories) para não tomarem a edição.
# O jornal é de NICHO (edition.focus_only: true): só entram as notícias cujo
# título cita alguma palavra-chave destas seções (ou cujo resumo as repete) e as
# de feeds especializados (niche: true em config/sources.yaml). As palavras-chave
# também classificam a notícia na seção (sem acento, minúsculas; casamento por
# palavra/trecho). Palavras com até 3 letras casam só inteiras; as demais
# toleram até 3 letras a mais ("tributari" → "tributarios"). Um "=" no fim força
# a palavra inteira ("ibs=" não casa com "ibset"). Evite termos genéricos: já
# trouxeram notícia errada "leao" (Papa Leão), "dividendos" (anúncio de
# pagamento), "consumidor" (inflação ao consumidor), "contrato" (contrato de
# empresa), "arbitragem" (futebol), "mediacao" (diplomacia), "fii" (fundos).
